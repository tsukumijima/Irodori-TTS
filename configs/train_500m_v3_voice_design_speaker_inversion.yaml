# Reference-initialized Speaker Inversion training for Irodori-TTS-600M-v3-VoiceDesign.
# The 500m filename follows the established v3 recipe naming convention.
#
# Prepare the fixed 30-second reference base first:
#   uv run prepare_speaker_inversion_base.py \
#     --checkpoint path/to/Irodori-TTS-600M-v3-VoiceDesign/model.safetensors \
#     --ref-wav path/to/reference.wav \
#     --max-ref-seconds 30 \
#     --expected-local-tokens 750 \
#     --output path/to/name.speaker-base.safetensors
#
# Usage:
#   uv run train.py \
#     --config configs/train_500m_v3_voice_design_speaker_inversion.yaml \
#     --manifest path/to/manifest.jsonl \
#     --init-checkpoint path/to/Irodori-TTS-600M-v3-VoiceDesign/model.safetensors \
#     --speaker-inversion-base-embedding path/to/name.speaker-base.safetensors \
#     --output-dir outputs/speaker_inversion/name
#
# The reference inputs must contain at least 30 seconds of audio. The preparation
# command truncates them to 30 seconds and verifies the 750 local Speaker Encoder
# tokens required by this recipe. Export recomputes the mean token for 751 total tokens.

model:
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 99574
  text_tokenizer_repo: llm-jp/llm-jp-3-150m
  model_dim: 1280
  num_layers: 12
  num_heads: 20
  mlp_ratio: 2.875
  text_mlp_ratio: 2.6
  speaker_mlp_ratio: 2.6
  text_dim: 512
  text_layers: 10
  text_heads: 8
  speaker_dim: 768
  speaker_layers: 8
  speaker_heads: 12
  speaker_patch_size: 1
  timestep_embed_dim: 512
  adaln_rank: 192
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 99574
  caption_tokenizer_repo: llm-jp/llm-jp-3-150m
  caption_add_bos: true
  caption_dim: 512
  caption_layers: 10
  caption_heads: 8
  caption_mlp_ratio: 2.6
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1024
  duration_layers: 3
  duration_dropout: 0.1
  duration_attention_heads: 8
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: rf
  speaker_inversion_enabled: true
  speaker_inversion_tokens: 751
  speaker_inversion_init_std: 0.02
  speaker_inversion_init_embedding:
  speaker_inversion_base_embedding:
  speaker_inversion_residual_regularization_weight: 0.01
  speaker_inversion_max_relative_residual_norm: 0.15
  batch_size: 16
  gradient_accumulation_steps: 1
  num_workers: 8
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4
  allow_tf32: true
  compile_model: false
  gradient_checkpointing: true
  precision: bf16
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 0.00000001
  lr_scheduler: cosine
  warmup_steps: 50
  max_steps: 2000
  min_lr_scale: 0.1
  max_text_len: 256
  max_caption_len: 512
  text_condition_dropout: 0.0
  speaker_condition_dropout: 0.0
  caption_condition_dropout: 0.0
  timestep_stratified: true
  max_latent_steps: 750
  ref_min_seconds: 1.0
  ref_max_seconds: 30.0
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  duration_loss_weight: 0.1
  duration_backprop_to_condition: false
  duration_speaker_dropout: 0.0
  duration_caption_dropout: 0.0
  duration_huber_delta: 0.1
  log_every: 20
  save_every: 250
  checkpoint_best_n: 0
  valid_ratio: 0.0
  valid_every: 0
  wandb_enabled: false
  wandb_project:
  wandb_entity:
  wandb_run_name:
  wandb_mode: online
  ddp_find_unused_parameters: false
  seed: 0
