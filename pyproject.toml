[build-system]
requires = ["uv_build>=0.9.21,<0.12.0"]
build-backend = "uv_build"

[project]
name = "irodori-tts"
version = "0.1.0"
description = "Irodori-TTS training and inference codebase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dacvae",
    "huggingface-hub>=0.34.0,<2.0",
    "pyyaml>=6.0",
    "safetensors>=0.7.0",
    "scipy>=1.11.0,<2.0",
    "soundfile>=0.12.0",
    "soxr>=1.0.0",
    "sentencepiece>=0.1.99,<0.2",
    "torch>=2.12.1,<2.13.0",
    "transformers",
]

# 単体利用時の依存関係グループ
[dependency-groups]
dev = [
    "datasets>=3.0.0",
    "gradio>=5.0.0",
    "nvidia-cudnn-frontend==1.26.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "peft>=0.18.0",
    "pytest>=8.4.2",
    "ruff>=0.14.8,<0.15.0",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher.git@d46d7d0893a583d8968ab3a6626e2289faec9152",
    "tqdm>=4.67.3",
    "wandb>=0.17.0",
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "1 week"

[tool.uv.build-backend]
# ルートに irodori_tts パッケージがあるため module-root を空にする
module-root = ""
source-include = [
    "configs/**",
    "tests/**",
    "LICENSE",
    "README.md",
]
source-exclude = [
    ".git",
    ".gitignore",
]

[tool.uv.sources]
dacvae = { git = "https://github.com/tsukumijima/dacvae", rev = "d165f907b9cf91d9e05a744f2a5adceaa815b039" }
# Windows x64・Linux x64: CUDA 13.0 版 / macOS・その他: PyPI から CPU 版
torch = [
    { index = "pytorch-cu130", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["irodori_tts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
