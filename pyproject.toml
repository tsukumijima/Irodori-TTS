[project]
name = "irodori-tts"
version = "0.1.0"
description = "Irodori-TTS training and inference codebase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dacvae",
    "huggingface-hub>=0.34.0,<2.0",
    "pyyaml>=6.0",
    "safetensors>=0.7.0",
    "scipy>=1.11.0,<2.0",
    "soundfile>=0.12.0",
    "soxr>=1.0.0",
    "sentencepiece>=0.1.99,<0.2",
    "torch>=2.9.0,<2.10.0",
    "transformers",
]

[project.optional-dependencies]
cpu = [
    "torch==2.9.0",
]
cu128 = [
    "torch==2.9.0",
]
dev = [
    "ruff>=0.9.0",
]
data = [
    "datasets>=3.0.0",
    "tqdm>=4.67.3",
]
gradio = [
    "gradio>=5.0.0",
]
optimization = [
    "nvidia-cudnn-frontend==1.26.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
lora = [
    "peft>=0.18.0",
]
training = [
    "peft>=0.18.0",
    "tqdm>=4.67.3",
    "wandb>=0.17.0",
]
watermark = [
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher.git@d46d7d0893a583d8968ab3a6626e2289faec9152",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
dacvae = { git = "https://github.com/tsukumijima/dacvae", rev = "d165f907b9cf91d9e05a744f2a5adceaa815b039" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["irodori_tts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools]
packages = ["irodori_tts"]
