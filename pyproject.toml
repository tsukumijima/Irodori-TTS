[project]
name = "irodori-tts"
version = "0.1.0"
description = "Irodori-TTS training and inference codebase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dacvae",
    "huggingface-hub>=0.34.0,<2.0",
    "pyyaml>=6.0",
    "safetensors>=0.7.0",
    "scipy>=1.11.0,<2.0",
    "soundfile>=0.12.0",
    "soxr>=1.0.0",
    "sentencepiece>=0.1.99,<0.2",
    "torch>=2.12.1,<2.13.0",
    "transformers>=5.12.1,<6",
]

# 単体利用時の依存関係グループ
[dependency-groups]
dev = [
    "datasets>=3.0.0",
    "gradio>=5.10.0",
    "llvmlite>=0.40.0",
    "numba>=0.57.0",
    "nvidia-cudnn-frontend==1.26.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "peft>=0.18.0",
    "pytest>=8.4.2",
    "ruff>=0.14.8,<0.15.0",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher.git@d46d7d0893a583d8968ab3a6626e2289faec9152",
    "taskipy>=1.14.0,<2.0.0",
    "torchao>=0.16.0,<0.17.0",
    "torchcodec>=0.10.0,<0.11.0",
    "tqdm>=4.67.3",
    "wandb>=0.17.0",
    "torchdata>=0.11.0",
]

[tool.taskipy.tasks]
lint = "ruff check --fix . && pyright"
format = "ruff format ."
typecheck = "pyright"
test = "pytest"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
exclude-newer = "1 week"

[tool.uv.build-backend]
# ルートに irodori_tts パッケージがあるため module-root を空にする
module-root = ""
source-include = [
    "configs/**",
    "tests/**",
    "LICENSE",
    "README.md",
]
source-exclude = [
    ".git",
    ".gitignore",
]

[tool.uv.sources]
dacvae = { git = "https://github.com/tsukumijima/dacvae", rev = "d165f907b9cf91d9e05a744f2a5adceaa815b039" }
# Windows x64・Linux x64: CUDA 13.0 版 / macOS・その他: PyPI から CPU 版
torch = [
    { index = "pytorch-cu130", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
# 1行の長さを最大100文字に設定
line-length = 100
# インデントの幅を4スペースに設定
indent-width = 4
# Python 3.11 を利用する
target-version = "py311"

[tool.ruff.lint]
# flake8, pycodestyle, pyupgrade, isort, Ruff 固有のルールを使う
select = ["F", "E", "W", "UP", "I", "RUF"]
ignore = [
    "E501",    # 1行の長さを超えている場合の警告を抑制
    "E731",    # Do not assign a `lambda` expression, use a `def` を抑制
    "RUF001",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF002",  # 全角記号など `ambiguous unicode character` も使いたいため
    "RUF003",  # 全角記号など `ambiguous unicode character` も使いたいため
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# インポートブロックの後に2行空ける
lines-after-imports = 2
known-first-party = ["irodori_tts"]

[tool.ruff.format]
# ダブルクオートを使う
quote-style = "double"
# インデントにはスペースを使う
indent-style = "space"

[tool.pyright]
# Python バージョンを指定
pythonVersion = "3.11"
# Pyright 実行時に .venv/ を確実に参照させる
# この設定により Codex サンドボックス上から Pyright を実行すると依存関係を解決できない問題を回避できる
venvPath = "."
venv = ".venv"
# TypeCheckingMode を strict に設定（VSCode の設定と同等）
typeCheckingMode = "strict"
# プロジェクトルートを指定
pythonPlatform = "All"
# インクルードするパッケージパス
include = [
    "irodori_tts/",
    "tests/",
]
# 除外するパス
exclude = [
    "**/__pycache__",
    "**/.*",
    "**/.venv",
    "**/*output*",
]
# 型スタブがない機械学習系ライブラリの実装解析で、ベンチマーク全体の型チェックが極端に遅くなることを防ぐ
useLibraryCodeForTypes = false
# VSCode の settings.json の diagnosticSeverityOverrides に対応する設定
reportConstantRedefinition = "none"
reportDeprecated = "warning"
reportGeneralTypeIssues = "warning"
# 新しい Pyright で reportGeneralTypeIssues から分離された診断も、研究用スクリプトでは警告として表示する
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
reportMissingParameterType = "warning"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "none"
reportPrivateUsage = "warning"
reportUntypedBaseClass = "none"
reportUnnecessaryComparison = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "none"
reportUntypedFunctionDecorator = "none"
reportUnusedFunction = "none"
reportUnusedVariable = "information"
